<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 My Love Proposal 💖</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
      animation: bgGlow 6s infinite alternate;
    }

    @keyframes bgGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0px 0px 30px rgba(255, 0, 100, 0.6);
      max-width: 480px;
      animation: fadeIn 2s ease-in-out;
      z-index: 10;
    }

    h1 {
      font-size: 32px;
      color: #d6336c;
      animation: heartbeat 2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    p {
      font-size: 18px;
      color: #444;
      min-height: 40px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 0 15px #ff4d6d;
    }

    .no {
      background: #444;
      color: white;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.8);}
      to {opacity: 1; transform: scale(1);}
    }

    /* Floating hearts, roses, sparkles */
    .float {
      position: absolute;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: randomColor;
      top: -10px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(720deg); }
    }
  </style>
</head>
<body>
  <!-- Floating animations -->
  <script>
    function createFloat(symbol) {
      const el = document.createElement("div");
      el.classList.add("float");
      el.innerHTML = symbol;
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = Math.random() * 25 + 20 + "px";
      el.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 7000);
    }
    setInterval(() => createFloat("❤️"), 800);
    setInterval(() => createFloat("🌹"), 1500);
    setInterval(() => createFloat("✨"), 1200);
  </script>

  <div class="container">
    <h1 id="question">Do you love me? 🥺💖</h1>
    <p id="message"></p>
    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn">Yes 💘</button>
      <button class="no" id="noBtn">No 💔</button>
    </div>
  </div>

  <!-- Romantic Background Music -->
  <audio id="bg-music" autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
  </audio>

  <script>
    let noClicks = 0;
    const question = document.getElementById("question");
    const message = document.getElementById("message");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttons = document.getElementById("buttons");

    function swapButtons() {
      buttons.insertBefore(noBtn, yesBtn);
    }

    function typeMessage(text) {
      message.innerHTML = "";
      let i = 0;
      const interval = setInterval(() => {
        message.innerHTML += text.charAt(i);
        i++;
        if (i === text.length) clearInterval(interval);
      }, 50);
    }

    noBtn.addEventListener("click", () => {
      noClicks++;
      if (noClicks === 1) {
        typeMessage("Ek baar aur soch lo jaanu 😌💕");
        swapButtons();
      } else if (noClicks === 2) {
        typeMessage("Dil todna buri baat hai 😤💔");
        swapButtons();
      } else if (noClicks === 3) {
        typeMessage("Sach bolo... tum bhi mujhe chahte ho 😍🌹");
        swapButtons();
      } else {
        typeMessage("Ab No button tumse door bhaag raha hai 😏💞");
        noBtn.style.position = "absolute";
        noBtn.style.transition = "0.2s";
        noBtn.addEventListener("mouseover", () => {
          noBtn.style.top = Math.random() * 200 + "px";
          noBtn.style.left = Math.random() * 200 + "px";
        });
      }
    });

    yesBtn.addEventListener("click", () => {
      question.innerHTML = "I knew it! 😍💋";
      typeMessage("I always knew you love me... Forever together 💖🌹✨");
      yesBtn.disabled = true;
      noBtn.disabled = true;

      // Confetti
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random() * 360},100%,50%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    });
  </script>
</body>
</html>
